    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('kuafi-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F7FAF8] text-[#0E1813] dark:bg-[#080C0A] dark:text-[#EFF4F1] antialiased selection:bg-emerald-600/20 selection:text-emerald-900 dark:selection:bg-emerald-400/25 dark:selection:text-emerald-100">

  </body>
